services:
  db:
    image: postgres:16-alpine
    container_name: imobiapi_db
    environment:
      POSTGRES_DB: imobiapi
      POSTGRES_USER: imobiapi
      POSTGRES_PASSWORD: imobiapi123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: imobiapi_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: